name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Two throwaway OpenSSH servers so the interoperability tests run for real
      # instead of being skipped.
      - name: Start test SSH servers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo tools/test-sshd.sh start | tail -n 1 | sed 's/^export //; s/'"'"'//g' >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: ./gradlew test --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            app/build/outputs/screenshots/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/
